name: Bug report
description: Report a reproducible Stone defect using synthetic data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include vulnerabilities, tokens, credentials, private notes, or repository names. Read SECURITY.md for security reporting."
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: Commit SHA or preview version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Windows
        - MCP
        - Shared packages / documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps with synthetic content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Relevant validation output
      description: Remove paths, project identifiers, and secrets.
