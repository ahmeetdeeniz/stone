name: Feature request
description: Propose a focused improvement consistent with Stone's product scope.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What personal-workspace problem should Stone solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain platform scope and how portable Markdown/local-first behavior is preserved.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Scope check
      options:
        - label: This does not require real-time teams/collaboration or proprietary note storage.
          required: true
        - label: This is not being presented as already implemented or committed roadmap.
          required: true
