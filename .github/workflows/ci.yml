name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm verify:native-dependencies
      - run: pnpm verify:desktop
      - run: pnpm verify:github
      - run: pnpm desktop:build
      - run: pnpm verify:mcp
      - run: pnpm mcp:build
      - run: pnpm expo:doctor
      - run: pnpm mobile:export
