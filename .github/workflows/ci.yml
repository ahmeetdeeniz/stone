name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-expo-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/expo-sdk-patches
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Align Expo SDK 54 patch versions
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"
        run: >-
          pnpm --filter @stone/mobile add
          expo@~54.0.37
          expo-constants@~18.0.14
          expo-file-system@~19.0.24
      - run: pnpm install --frozen-lockfile
      - run: pnpm expo:doctor
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm mobile:export
      - name: Commit generated lockfile and restore CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git checkout origin/master -- .github/workflows/ci.yml
          git rm .github/workflows/repair-expo-sdk-patches.yml
          git add -- apps/mobile/package.json pnpm-lock.yaml .github/workflows/ci.yml .github/workflows/repair-expo-sdk-patches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: align Expo SDK 54 patch versions"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:fix/expo-sdk-patches
