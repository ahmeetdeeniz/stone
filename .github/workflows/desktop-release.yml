name: Desktop Windows Release

# Builds the production Stone Windows installer (NSIS setup.exe). Separate from ci.yml (which
# runs on every push/PR on Linux) because this job needs a Windows MSVC runner and a native
# Rust/Tauri build, which is slower and only needed for release artifacts.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    runs-on: windows-latest
    # Job-level env (not step-level) so every step that builds the desktop frontend or the
    # Tauri installer -- `pnpm desktop:build` and `pnpm --filter @stone/desktop run
    # tauri:build:nsis` (which runs the same frontend build via Tauri's beforeBuildCommand) --
    # sees identical values. These come from repository Variables (Settings > Secrets and
    # variables > Actions > Variables), not Secrets: a Firebase Web API key and a GitHub OAuth
    # App client ID are public, client-side identifiers by design, never a service-account
    # credential, client secret, access token or signing credential. Vite bakes VITE_*-prefixed
    # process.env values into the built bundle at build time (see apps/desktop/vite.config.ts),
    # which is the normal, intended place these values end up. If these Variables are not
    # configured (e.g. a public self-hoster's own fork), the build still succeeds and produces
    # an installer that shows a clear runtime configuration error instead of failing to build.
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
    steps:
      # Defense-in-depth alongside the repository's .gitattributes (the actual source of
      # truth for line endings): Git for Windows defaults to core.autocrlf=true, which would
      # otherwise rewrite checked-out LF files to CRLF and break Prettier's format:check.
      - name: Disable line-ending conversion on checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs before the Rust toolchain/cache steps below, so wiping generated output here
      # (dist/tsbuildinfo across every workspace package, and any stray Cargo target/) never
      # discards anything Swatinem/rust-cache restores afterward. This is what catches
      # dependency-order problems between @stone/* workspace packages that only reproduce on
      # a clean checkout (see scripts/verify-clean-workspace.mjs) and replaces a plain
      # `pnpm typecheck`, which it also runs as its final step.
      - run: pnpm run verify:clean-workspace

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm verify:desktop

      # Reports only whether each variable is configured or missing -- never the values
      # themselves -- so a run's log makes it obvious why an installer would show the runtime
      # "not configured" error, without exposing anything.
      - name: Report desktop build-time configuration status
        run: pnpm run report:desktop-build-env

      - run: pnpm desktop:build

      # Uses the dedicated tauri:build:nsis script (which already bakes in --bundles nsis)
      # invoked with no extra arguments, rather than forwarding "-- --bundles nsis" through
      # pnpm run: that pattern makes pnpm/Tauri's own "--" Cargo-argument separator land in
      # front of --bundles, so Tauri forwards --bundles to cargo.exe instead of handling it
      # itself, and cargo.exe rejects it ("unexpected argument '--bundles' found").
      - name: Build NSIS installer
        run: pnpm --filter @stone/desktop run tauri:build:nsis

      - name: Compute installer checksums
        shell: pwsh
        run: |
          $bundleDir = "apps/desktop/src-tauri/target/release/bundle/nsis"
          $installers = Get-ChildItem -Path $bundleDir -Filter *.exe
          if ($installers.Count -eq 0) {
            throw "No NSIS installer was produced in $bundleDir"
          }
          foreach ($installer in $installers) {
            $hash = Get-FileHash -Algorithm SHA256 -Path $installer.FullName
            "$($hash.Hash.ToLower())  $($installer.Name)" |
              Out-File -FilePath "$($installer.FullName).sha256" -Encoding ascii -NoNewline
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: stone-desktop-windows-nsis
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
          retention-days: 30
