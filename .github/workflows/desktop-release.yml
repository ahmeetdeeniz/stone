name: Desktop Release

# Builds the Stone desktop installers: Windows (NSIS setup.exe), macOS (universal .dmg) and
# Linux (.deb and .AppImage). Separate from ci.yml (which runs on every push/PR on Linux)
# because these jobs need native runners and full Tauri builds, which are slower and only
# needed for release artifacts. A `v*.*.*` tag additionally publishes a draft GitHub release
# with every installer and, when an updater signing key is configured, the `latest.json`
# manifest the in-app updater reads.
#
# Optional repository configuration (Settings > Secrets and variables > Actions):
# - Secrets TAURI_SIGNING_PRIVATE_KEY (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD) and Variable
#   TAURI_UPDATER_PUBKEY: sign updates and turn on auto-update. See public-docs/BUILDS.md.
# - Secrets APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
#   APPLE_PASSWORD and APPLE_TEAM_ID: Developer ID signing and notarization on macOS.
# Without them the same workflow still produces working (unsigned or ad-hoc signed) builds.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            rust-targets: x86_64-pc-windows-msvc
          - platform: macos
            runner: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # The oldest supported Ubuntu keeps the glibc requirement of the binaries low.
          - platform: linux
            runner: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
    # Job-level env (not step-level) so every step that builds the desktop frontend or the
    # Tauri installer -- `pnpm desktop:build` and the `tauri:build:*` scripts (which run the
    # same frontend build via Tauri's beforeBuildCommand) -- sees identical values. These come
    # from repository Variables (Settings > Secrets and variables > Actions > Variables), not
    # Secrets: a Firebase Web API key and a GitHub OAuth App client ID are public, client-side
    # identifiers by design, never a service-account credential, client secret, access token
    # or signing credential. Vite bakes VITE_*-prefixed process.env values into the built
    # bundle at build time (see apps/desktop/vite.config.ts), which is the normal, intended
    # place these values end up. If these Variables are not configured (e.g. a public
    # self-hoster's own fork), the build still succeeds and produces an installer that shows a
    # clear runtime configuration error instead of failing to build.
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
    steps:
      # Defense-in-depth alongside the repository's .gitattributes (the actual source of
      # truth for line endings): Git for Windows defaults to core.autocrlf=true, which would
      # otherwise rewrite checked-out LF files to CRLF and break Prettier's format:check.
      - name: Disable line-ending conversion on checkout
        if: matrix.platform == 'windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux WebKit and bundling dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - run: pnpm install --frozen-lockfile

      # Runs before the Rust toolchain/cache steps below, so wiping generated output here
      # (dist/tsbuildinfo across every workspace package, and any stray Cargo target/) never
      # discards anything Swatinem/rust-cache restores afterward. This is what catches
      # dependency-order problems between @stone/* workspace packages that only reproduce on
      # a clean checkout (see scripts/verify-clean-workspace.mjs) and replaces a plain
      # `pnpm typecheck`, which it also runs as its final step.
      - run: pnpm run verify:clean-workspace

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.platform }}

      # The full repository checks run once, on the Windows runner (ci.yml already covers
      # Linux), where they also catch Windows-only problems such as line endings.
      - if: matrix.platform == 'windows'
        run: pnpm format:check
      - if: matrix.platform == 'windows'
        run: pnpm lint
      - if: matrix.platform == 'windows'
        run: pnpm test
      - run: pnpm verify:desktop
      - if: matrix.platform == 'windows'
        run: pnpm verify:i18n

      # Reports only whether each variable is configured or missing -- never the values
      # themselves -- so a run's log makes it obvious why an installer would show the runtime
      # "not configured" error, without exposing anything.
      - name: Report desktop build-time configuration status
        run: pnpm run report:desktop-build-env

      # Writes the gitignored tauri.<platform>.conf.json (updater endpoint + public key, macOS
      # ad-hoc signing) that Tauri merges into this build. It is told only whether the signing
      # secrets exist, never their values, and on tag builds it fails when the tag does not
      # match the app version.
      - name: Configure release signing
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: node scripts/desktop-release.mjs config

      - run: pnpm desktop:build

      # Uses the dedicated tauri:build:nsis script (which already bakes in --bundles nsis)
      # invoked with no extra arguments, rather than forwarding "-- --bundles nsis" through
      # pnpm run: that pattern makes pnpm/Tauri's own "--" Cargo-argument separator land in
      # front of --bundles, so Tauri forwards --bundles to cargo.exe instead of handling it
      # itself, and cargo.exe rejects it ("unexpected argument '--bundles' found").
      - name: Build NSIS installer
        if: matrix.platform == 'windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @stone/desktop run tauri:build:nsis

      # Signing variables that are configured but empty would make the bundler try (and fail)
      # to import an empty certificate, so unset ones are removed before building.
      - name: Build macOS universal app and DMG
        if: matrix.platform == 'macos'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          pnpm --filter @stone/desktop run tauri:build:macos

      - name: Build Linux packages
        if: matrix.platform == 'linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @stone/desktop run tauri:build:linux

      # Copies installers (and updater signatures) into one flat folder with a SHA-256
      # checksum file next to each installer.
      - name: Collect installers and checksums
        run: node scripts/desktop-release.mjs collect release-out

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: stone-desktop-${{ matrix.platform }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.ref_type == 'tag'
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: stone-desktop-*
          merge-multiple: true

      - name: Write updater manifest
        run: node scripts/desktop-release.mjs manifest release-assets

      # A draft, so a maintainer reviews it before it becomes the "latest" release that
      # installed apps update to.
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --draft --verify-tag --generate-notes --title "Stone $GITHUB_REF_NAME"
