[package]
name = "stone-desktop"
version = "0.1.0"
description = "Stone local-first Markdown workspace"
authors = ["Stone contributors"]
edition = "2021"

[lib]
name = "stone_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
chrono = { version = "0.4.41", features = ["clock", "serde"] }
keyring = { version = "4.1.5", default-features = true }
notify = "8.2.0"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "2.11.1", features = [] }
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["v4", "v5", "serde"] }
rfd = "0.15.4"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# Only used by the opt-in tests/github_live.rs suite (`cargo test --test github_live -- --ignored`)
# to drive the real async GitHub/Git production functions from a test process.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
base64 = "0.22.1"
